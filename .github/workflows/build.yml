name: Build PinAuth

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for attaching the JAR to a release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Verify JAR contents
        run: |
          JAR=$(ls target/PinAuth-*.jar | head -n 1)
          echo "Built: $JAR"
          unzip -l "$JAR" | grep -E "plugin.yml|config.yml|com/kodeshi/pinauth/PinAuthPlugin.class"
          unzip -p "$JAR" plugin.yml | grep -E "^(name|version|main|api-version):"
          # plugin.yml must be filtered (no unresolved ${...} placeholders)
          if unzip -p "$JAR" plugin.yml | grep -q '\${'; then echo "Unresolved placeholder in plugin.yml"; exit 1; fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinAuth-jar
          path: target/PinAuth-*.jar
          if-no-files-found: error

      - name: Attach JAR to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/PinAuth-*.jar
