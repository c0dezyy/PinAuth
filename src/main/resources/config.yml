# ======================================================================
#  PinAuth configuration  (Kodeshi SMP)
#  Reload with /pinauth reload. Invalid values fall back to defaults and
#  a warning is shown; invalid YAML keeps the previous settings.
# ======================================================================

# PIN length. The default (6/6) means exactly six digits. Allowed: 4-8.
min-pin-length: 6
max-pin-length: 6

# Wrong PINs allowed before the player is disconnected (1-20).
max-login-attempts: 4

# Seconds an unauthenticated player may stay online. 0 = no timeout (default).
login-timeout-seconds: 0

# After the last wrong attempt the ACCOUNT is locked for this long (seconds).
# The failed-attempt counter is stored in the database, so reconnecting does
# not reset it. 0 = no lockout (counter resets on kick; not recommended).
lockout-duration-seconds: 300

# Minimum time between two PIN checks of the same player (anti-guessing).
attempt-cooldown-millis: 1500

allow-bedrock-players: true
require-pin-confirmation: true
freeze-unauthenticated-players: true
reopen-gui-on-close: true

# How many times a player may close the PIN window before being kicked.
max-gui-closes: 5

# Refuse a second connection for an account that is already online.
# Strongly recommended on offline-mode servers (prevents name hijacking).
prevent-duplicate-login: true

# Reject PINs like 000000, 111111, 123456, 654321 when creating a PIN.
reject-weak-pins: false

# Registration confirmation mismatches before kick + temporary registration block.
max-registration-failures: 5
registration-block-seconds: 300

# Commands unauthenticated players may use (lowercase, without "/").
allowed-commands:
  - pin

# Trusted-IP auto login. ANY player connecting from a listed IP skips the PIN screen
# (no PIN registration or login needed). The account name/UUID is NOT checked.
# WARNING: only list IPs that belong to people you trust, and that nobody else shares
# (public Wi-Fi, school/office networks, VPNs and mobile data/CGNAT are risky). Anyone who
# can join from that IP while using any player name gets logged in as that name.
# Geyser/proxy: if Bedrock players connect through Geyser on the same machine or through a
# proxy, their IP is the proxy's IP - listing it would exempt ALL of them.
ip-exemptions:
  enabled: false
  allow-loopback: false     # 127.0.0.1 / ::1 are ignored unless this is true
  ips: []
  #  - "203.0.113.5"
  #  - "198.51.100.7"

security:
  # PBKDF2-HMAC-SHA256 iterations for NEW hashes (100000 - 5000000).
  pbkdf2-iterations: 310000
  # Mix a secret server-side key (plugins/PinAuth/pepper.key) into every hash.
  # A stolen accounts.db alone then cannot be brute-forced. KEEP pepper.key IN BACKUPS.
  use-pepper: true

gui:
  open-delay-ticks: 10
  reopen-delay-ticks: 2
  titles:
    login: "Kodeshi SMP | Login"
    register: "Kodeshi SMP | Register"
    register-confirm: "Kodeshi SMP | Confirm PIN"
    change-old: "Kodeshi SMP | Current PIN"
    change-new: "Kodeshi SMP | New PIN"
    change-confirm: "Kodeshi SMP | Confirm New PIN"
  # 54-slot chest (6 rows). Slots are numbered 0-53, left to right, top to bottom.
  slots:
    head: 4
    pin-start: 10          # first PIN indicator; the next (length-1) slots are used too
    digits: [49, 21, 22, 23, 30, 31, 32, 39, 40, 41]   # index = digit 0..9
    clear: 48
    delete: 50
    confirm: 53
    cancel: 45
  materials:
    head: PLAYER_HEAD
    digit: WHITE_CONCRETE
    clear: RED_CONCRETE
    delete: ORANGE_CONCRETE
    confirm: LIME_CONCRETE
    cancel: BARRIER
    filler: BLACK_STAINED_GLASS_PANE
    pin-empty: GRAY_STAINED_GLASS_PANE
    pin-filled: LIME_STAINED_GLASS_PANE

