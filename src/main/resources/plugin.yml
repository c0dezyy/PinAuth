name: PinAuth
version: '${project.version}'
main: com.kodeshi.pinauth.PinAuthPlugin
api-version: '1.21'
description: Crossplay 6-digit PIN authentication with an inventory keypad (Java + Bedrock via Geyser/Floodgate)
authors: [Kodeshi]
softdepend: [floodgate, Geyser-Spigot]
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.3

commands:
  pinreset:
    description: Clear a player's PIN and force them to register a new one
    usage: /pinreset <player>
    permission: pinauth.admin
  clearpin:
    description: Alias-style command that clears a player's PIN
    usage: /clearpin <player>
    permission: pinauth.admin
  pinstatus:
    description: Show whether a player has a registered PIN
    usage: /pinstatus <player>
    permission: pinauth.admin
  pinauth:
    description: PinAuth administration (reload, help)
    usage: /pinauth <reload|help>
    permission: pinauth.admin
  pin:
    description: Reopen the PIN window
    usage: /pin
  changepin:
    description: Change your PIN (requires your current PIN)
    usage: /changepin
    permission: pinauth.change

permissions:
  pinauth.admin:
    description: Administrative commands (/pinreset, /clearpin, /pinstatus, /pinauth help)
    default: op
    children:
      pinauth.reload: true
  pinauth.reload:
    description: Reload the configuration (/pinauth reload)
    default: op
  pinauth.change:
    description: Change your own PIN with /changepin
    default: true
